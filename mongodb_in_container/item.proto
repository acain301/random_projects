syntax = "proto3";

package item;

service ItemService {
  rpc CreateItem (ItemRequest) returns (ItemResponse);
  rpc GetItems (Empty) returns (ItemList);
}

message ItemRequest {
  string name = 1;
  string description = 2;
}

message ItemResponse {
  string id = 1;
  string message = 2;
}

message Item {
  string id = 1;
  string name = 2;
  string description = 3;
}

message ItemList {
  repeated Item items = 1;
}

message Empty {}

